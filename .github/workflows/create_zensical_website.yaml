name: create_zensical_website

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/create_zensical_website.yaml'
      - 'zensical.toml'
      - 'docs/**'

jobs:
  docs:
    name: create_zensical_website
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.zensical.outputs.page_url }}

    steps:
      - name: Zensical Action
        id: zensical
        uses: cssnr/zensical-action@v1

