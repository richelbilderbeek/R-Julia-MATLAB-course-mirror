    { "Projects" = "projects.md" },
    { "Use the tarball" = "common/use_tarball.md" },
    { "Use a text editor" = "common/use_text_editor.md" },
    { "HPC clusters" = "common/hpc_clusters.md" },
    { "Other courses" = "common/other_courses.md" },
    { "Desktop on demand" = "common/on-demand.md" }
  ]},
  { "R" = [
    { "Schedule" = "r/schedule.md" },
    { "Intro" = "r/intro/README.md" },
    { "Load and run" = "r/load_run/README.md" },
    { "Packages" = "r/packages.md" },
    { "Batch" = "r/batch.md" },
    { "Interactive" = "r/interactive.md" },
    { "RStudio" = "r/rstudio/README.md" },
    { "RStudio through OpenOnDemand" = "r/rstudio-ondemand.md"},
    { "Summary" = "r/summary/README.md" },
    { "Evaluation" = "r/evaluation.md" },
    { "Videos" = "r/videos.md" }
  ]},
  { "MATLAB" = [
    { "Schedule" = "matlab/schedule.md" },
    { "Intro" = "matlab/intro-matlab.md" },
    { "Load and run" = "matlab/load_runMatlab.md" },
    { "MATLAB terminal and Slurm" = "matlab/slurmMatlab.md" },
    { "Interactive work on the compute nodes" = "matlab/interactive.md" },
    { "MATLAB GUI and batch jobs" = "matlab/MatlabGUIslurm.md" },
